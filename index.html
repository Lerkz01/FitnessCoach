<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS liest kein Manifest-Icon für den Homescreen, nur diese Angabe. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f17" />
    <!--
      Ohne diese Angabe startet die App auf iOS im Safari-Rahmen, auch wenn
      sie auf dem Homescreen liegt — mit Adressleiste, die beim Scrollen
      wandert. Das kostet im Gym sichtbaren Platz.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta
      name="description"
      content="Dein persönlicher Trainings- und Ernährungscoach"
    />
    <title>Fitness Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
